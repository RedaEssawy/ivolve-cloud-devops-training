apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nodejs-app
  name: nodejs-app
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  strategy: {}
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      imagePullSecrets:
        - name: dockerhub-credinials
      containers:

        - image: redaeid/kubernets-app_web-app:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          name: nodejs-app
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          env:
    
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: non-sensitive-env
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: non-sensitive-env
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sensitive-var
                  key: DB_PASSWORD

          volumeMounts:
          
            - mountPath: /app/logs
              name: nodejs-app-volume
        
        
      tolerations:
        - key: "node"
          operator: "Equal"
          value: "worker"
          effect: "NoSchedule"
      volumes:
        - name: nodejs-app-volume
          persistentVolumeClaim:
            claimName: pvc-retain

status: {}
